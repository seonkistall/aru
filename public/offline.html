<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- This file is a real page at /offline.html: it answers 200, it carries a
         <title>, and nothing stops a crawler reaching it. It is named as a string
         literal in /sw.js, which robots.txt allows a crawler to fetch, so
         "nobody links to it" is not a defence. It is not in SEO_ROUTES either,
         and the route-table guard in tests/seo-metadata.test.ts walks app/ only,
         so it could never have caught a static page in public/. Without this tag
         the site's own offline notice is an indexable page competing with /.
         Checked by "every HTML file under public/ says noindex". -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <title>아루 ARU — 오프라인</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #fff; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); border: 1px solid #dcdcdc; border-radius: 12px; padding: 28px 24px; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; background: #1a1a1a; color: #fff; font-weight: 800; letter-spacing: .04em; }
      h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.25; }
      p { margin: 0; color: #3d3d3d; font-size: 14px; line-height: 1.6; }
      button { width: 100%; min-height: 48px; margin-top: 22px; border: 0; border-radius: 9px; background: #d9362b; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
      small { display: block; margin-top: 14px; color: #6e6e6e; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ARU</div>
      <h1>지금은 연결할 수 없어요</h1>
      <p>처음 스캔하거나 새 추천을 만들려면 네트워크 연결이 필요해요. 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
      <!-- `lang="en"` on this line and not on <html>: the page is Korean with one
           English sentence, and a single document language made a screen reader read
           the English with Korean pronunciation rules (WCAG 3.1.2 Language of Parts).
           What this does NOT fix, and it is recorded rather than papered over: a ja/zh/ar
           visitor still gets Korean plus this line. The page is a static file with no
           dictionary and no build step, so serving it in five languages means five
           copies of the copy inside it — a bigger change than the mismatch justifies. -->
      <small lang="en">ARU needs a connection for first use. Check your network and try again.</small>
    </main>
  </body>
</html>
